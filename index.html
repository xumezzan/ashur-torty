html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#ece5f0;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;left:0;top:0;display:block;touch-action:none}
#ui{position:fixed;left:0;top:0;width:360px;height:720px;transform-origin:0 0;pointer-events:none;font-family:PS2P,monospace}
.panel{position:absolute;left:26px;width:308px;box-sizing:border-box;padding:16px 14px 14px;
  background:rgba(43,24,36,.9);color:#fff;border:4px solid #2a1720;
  box-shadow:0 0 0 3px #f7a2b6,0 0 0 6px #2a1720,0 10px 0 6px rgba(42,23,32,.35);
  text-align:center;pointer-events:auto;display:none}
.panel.show{display:block;animation:pop .18s steps(3)}
@keyframes pop{from{transform:scale(.85);opacity:.3}to{transform:scale(1);opacity:1}}
.panel h2{margin:0 0 12px;font-size:15px;line-height:1.35;color:#ffc6d2;text-shadow:2px 2px 0 #7a2840;font-weight:normal}
.panel p{margin:0 0 10px;font-size:9px;line-height:1.75;color:#f4ecf2}
.panel .keys{color:#ffe08a}
.panel .big{font-size:12px;color:#fff;margin:6px 0 4px}
.panel .rec{font-size:10px;color:#ffe08a;margin:4px 0 12px}
.panel .new{color:#7dff9a;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.btn{display:block;width:100%;margin:8px 0 0;padding:13px 6px 11px;font-family:PS2P,monospace;font-size:13px;color:#fff;
  background:#e8708c;border:0;border-bottom:5px solid #9b3552;border-radius:0;
  box-shadow:0 0 0 3px #2a1720;cursor:pointer;text-shadow:2px 2px 0 #9b3552;-webkit-appearance:none;appearance:none}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.alt{background:#5aa0e0;border-bottom-color:#2d5f93;text-shadow:2px 2px 0 #2d5f93;font-size:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="panel" id="panel">
    <h2 id="pTitle"></h2>
    <div id="pBody"></div>
    <button class="btn" id="btnMain">ИГРАТЬ</button>
    <button class="btn alt" id="btnShare">ПОХВАСТАТЬСЯ В ЧАТЕ</button>
  </div>
</div>
<script>
(() => {
'use strict';

/* ==== НАСТРОЙКИ ==== */
// Ссылка, которую игра отправляет в чат кнопкой «Похвастаться».
// После создания Mini App в @BotFather впиши сюда её адрес, например 'https://t.me/AshurCakesBot/play'
const SHARE_URL = '';

const SW = 360, SH = 720;                 // логический размер сцены
const AP = 2;                             // 1 «пиксель» фона = 2 единицы сцены
const BG = { x0: -180, y0: -100, w: 720, h: 880 };

/* ==== Telegram ==== */
const TG = window.Telegram && window.Telegram.WebApp;
const inTG = !!(TG && TG.initData);
function tgTry(fn) { try { fn(); } catch (e) {} }
if (TG) {
  tgTry(() => TG.ready());
  tgTry(() => TG.expand());
  tgTry(() => { if (TG.isVersionAtLeast && TG.isVersionAtLeast('7.7')) TG.disableVerticalSwipes(); });
  tgTry(() => { if (TG.isVersionAtLeast && TG.isVersionAtLeast('6.1')) { TG.setHeaderColor('#1e2a38'); TG.setBackgroundColor('#ece5f0'); } });
  tgTry(() => { if (TG.isVersionAtLeast && TG.isVersionAtLeast('8.0') && TG.lockOrientation) TG.lockOrientation(); });
}
function haptic(kind) {
  if (!TG || !TG.HapticFeedback) return;
  tgTry(() => {
    if (kind === 'catch') TG.HapticFeedback.impactOccurred('light');
    else if (kind === 'move') TG.HapticFeedback.selectionChanged();
    else if (kind === 'miss') TG.HapticFeedback.notificationOccurred('error');
    else if (kind === 'over') TG.HapticFeedback.notificationOccurred('warning');
  });
}

/* ==== утилиты ==== */

}

/* ==== пиксельный слой: рисуем в «логических» координатах, храним в низком разрешении ==== */
function Layer(x0, y0, w, h, ap) {
  const W = Math.round(w / ap), H = Math.round(h / ap);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const img = g.createImageData(W, H), d = img.data;
  const X = x => (x - x0) / ap, Y = y => (y - y0) / ap;
  function set(px, py, col) {
    if (px < 0 || py < 0 || px >= W || py >= H) return;
    const i = (py * W + px) * 4, v = rgb(col);
    d[i] = v[0]; d[i + 1] = v[1]; d[i + 2] = v[2]; d[i + 3] = 255;
  }
  const L = {
    c, W, H, X, Y, set,
    get(px, py) { const i = (py * W + px) * 4; return d[i + 3] ? [d[i], d[i + 1], d[i + 2]] : null; },
    rect(col, x, y, w, h) {
      const a = Math.round(X(x)), b = Math.round(Y(y)), e = Math.round(X(x + w)), f = Math.round(Y(y + h));
      for (let j = b; j < Math.max(f, b + 1); j++) for (let i = a; i < Math.max(e, a + 1); i++) set(i, j, col);
    },
    dot(col, x, y) { set(Math.round(X(x)), Math.round(Y(y)), col); },
    ell(col, cx, cy, rx, ry) {
      const CX = X(cx), CY = Y(cy), RX = rx / ap, RY = ry / ap;
      for (let j = Math.floor(CY - RY); j <= Math.ceil(CY + RY); j++) {
        const dy = (j + 0.5 - CY) / RY; if (Math.abs(dy) > 1) continue;
        const hw = RX * Math.sqrt(1 - dy * dy);
        for (let i = Math.round(CX - hw); i < Math.round(CX + hw); i++) set(i, j, col);
      }
    },
    poly(col, pts) {
      const P = pts.map(p => [X(p[0]), Y(p[1])]);
      let mn = 1e9, mx = -1e9; P.forEach(p => { mn = Math.min(mn, p[1]); mx = Math.max(mx, p[1]); });
      for (let j = Math.floor(mn); j <= Math.ceil(mx); j++) {
        const yy = j + 0.5, xs = [];
        for (let k = 0; k < P.length; k++) {
          const [x1, y1] = P[k], [x2, y2] = P[(k + 1) % P.length];
          if ((y1 <= yy && y2 > yy) || (y2 <= yy && y1 > yy)) xs.push(x1 + (yy - y1) * (x2 - x1) / (y2 - y1));
        }
        xs.sort((a, b) => a - b);
        for (let k = 0; k + 1 < xs.length; k += 2) for (let i = Math.round(xs[k]); i < Math.round(xs[k + 1]); i++) set(i, j, col);
      }
    },
    line(col, xa, ya, xb, yb, w = 2) {
      const n = Math.ceil(Math.hypot(xb - xa, yb - ya) / ap * 2) + 1;
      for (let k = 0; k <= n; k++) { const t = k / n; L.rect(col, xa + (xb - xa) * t - w / 2, ya + (yb - ya) * t - w / 2, w, w); }
    },
    done() { g.putImageData(img, 0, 0); return c; }
  };
  return L;
}

/* ==== декор ==== */
function rose(L, x, y, s, pal) {
  L.ell(pal[1], x, y, s, s * 0.92);

  L.dot(pal[2], x - s * 0.35, y - s * 0.45);

}
function leaves(L, x, y, r, R, n) {
  const G = [C.g1, C.g2, C.g3, C.g4, C.g3];
  for (let k = 0; k < n; k++) {
    const a = R() * Math.PI * 2, d = R() * r;
    const lx = x + Math.cos(a) * d, ly = y + Math.sin(a) * d * 0.8;
    L.rect(G[(R() * G.length) | 0], lx, ly, R() < 0.5 ? 4 : 2, 2);
  }
}
function garland(L, pts, r, R, rosesEvery = 9, roseSize = 4.5, leafN = 7) {
  let acc = 0;
  for (let k = 0; k + 1 < pts.length; k++) {
    const [xa, ya] = pts[k], [xb, yb] = pts[k + 1];
    const len = Math.hypot(xb - xa, yb - ya), steps = Math.ceil(len / 3);
    for (let s = 0; s <= steps; s++) {

      leaves(L, x, y, r, R, leafN);
      acc += 3;
      if (acc >= rosesEvery) {
        acc = 0;
        const ox = (R() - 0.5) * r * 1.1, oy = (R() - 0.5) * r * 0.9;
        rose(L, x + ox, y + oy, roseSize * (0.8 + R() * 0.45), ROSES[(R() * ROSES.length) | 0]);
      }
    }
  }
}
function bouquet(L, x, y, r, R, n = 10) {
  leaves(L, x, y, r * 1.1, R, n * 6);

function drapeColor(u) {
  u = ((u % 1) + 1) % 1;

  if (u < 0.26) return C.dShade;
  if (u < 0.42) return C.dMid;
  if (u < 0.78) return C.dLight;
  if (u < 0.9) return C.dMid;

}

/* ==== ГЕОМЕТРИЯ ИГРЫ ==== */
const K = 0.36, TH = Math.atan(K), COS = Math.cos(TH), SIN = Math.sin(TH);
const CAKE_H = 66, CAKE_W = 56, HALF = CAKE_H / 2;
const PLANK_END = 114;                     // x конца левой полки (правой — зеркально)
const PLANK_Y = { up: 351, dn: 461 };       // y поверхности у конца полки

const FLOOR_Y = { up: 470, dn: 618 };

const RAMPS = [
  { side: 'L', up: true }, { side: 'L', up: false }, { side: 'R', up: true }, { side: 'R', up: false }
].map((r, i) => {
  const yEnd = r.up ? PLANK_Y.up : PLANK_Y.dn;

    endC, catchY: endC.y + 44, catchX: CATCH_X[r.side], floor: r.up ? FLOOR_Y.up : FLOOR_Y.dn

/* ==== ПОЛКИ ==== */
function paintPlank(L, r) {
  const x0 = r.side === 'L' ? BG.x0 : BG.x0 + BG.w, x1 = r.xEnd;
  const y0 = r.yAt(x0), y1 = r.yEnd;
  // верхняя грань
  L.poly(C.woodK, [[x0, y0 - 6], [x1, y1 - 6], [x1, y1 + 14], [x0, y0 + 14]]);
  L.poly(C.woodL, [[x0, y0 - 4], [x1 - r.dir * 2, y1 - 4], [x1 - r.dir * 2, y1 + 1], [x0, y0 + 1]]);
  L.poly(C.wood, [[x0, y0 - 2], [x1 - r.dir * 2, y1 - 2], [x1 - r.dir * 2, y1 + 1], [x0, y0 + 1]]);
  L.poly(C.woodM, [[x0, y0 + 2], [x1 - r.dir * 2, y1 + 2], [x1 - r.dir * 2, y1 + 11], [x0, y0 + 11]]);
  L.poly(C.woodD, [[x0, y0 + 8], [x1 - r.dir * 2, y1 + 8], [x1 - r.dir * 2, y1 + 11], [x0, y0 + 11]]);
  // текстура дерева
  const R = rng(r.i * 77 + 5);
  for (let k = 0; k < 26; k++) {
    const x = x1 - r.dir * (8 + R() * 300), w = 6 + R() * 16;
    const y = r.yAt(x) + 4 + R() * 5;
    L.line(C.woodD, x, y, x - r.dir * w, y - w * K * 1, 1);
  }
  // кронштейн
  const bx = x1 - r.dir * 34;
  const by = r.yAt(bx) + 12;
  L.poly(C.woodK, [[bx - r.dir * 2, by - 1], [bx - r.dir * 34, by - 1 - 34 * K], [bx - r.dir * 34, by + 24]]);
  L.poly(C.woodM, [[bx - r.dir * 5, by], [bx - r.dir * 32, by - 34 * K + 2], [bx - r.dir * 32, by + 18]]);
  // гирлянда под полкой
  const gp = [];
  for (let x = x1 - r.dir * 6; Math.abs(x - x1) < 120; x -= r.dir * 6) gp.push([x, r.yAt(x) + 13 + Math.sin(Math.abs(x - x1) / 120 * Math.PI) * 5]);
  garland(L, gp, 4, R, 14, 3.2, 3);
}

      if (c.ramp === ri && Math.abs(c.arrive - arr) < T * 0.36) { ok = false; break; }

        S.lives--; S.shake = 0.25; SFX.miss(); haptic('miss');
        S.ash.shake = 0.35; S.ash.sweat = 0.8;
        if (S.lives > 0) crowd('miss', r.side);
        addFx({ kind: 'text', text: 'МИМО!', x: c.x, y: r.floor - 40, col: '#ff6b81', life: 1 });
        if (S.lives <= 0) { gameOver(); break; }
      }
    }
  }
  S.cakes = S.cakes.filter(c => c.state !== 'gone');
}

/* ==== ОТРИСОВКА ==== */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1, KS = 1, OX = 0, OY = 0;
let bgLayer = null, lowerLayer = null;
function resize() {
  VW = window.innerWidth; VH = window.innerHeight; DPR = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  KS = Math.min(VW / SW, VH / SH);
  OX = (VW - SW * KS) / 2; OY = (VH - SH * KS) / 2;
  const ui = document.getElementById('ui');
  ui.style.transform = `translate(${OX}px,${OY}px) scale(${KS})`;
}
window.addEventListener('resize', resize);
if (TG) tgTry(() => TG.onEvent('viewportChanged', resize));

function drawCake(x, y, rot, scale = 1, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot);
  ctx.drawImage(CAKE_HI, -CAKE_W / 2 * scale, -CAKE_H / 2 * scale, CAKE_W * scale, CAKE_H * scale);
  ctx.restore();
}
function drawAshur() {
  const a = S.ash;
  if (!ASHUR.complete || !ASHUR.naturalWidth) return;
  renderRig(a);
  const l = ashLeft(a), sh = a.shake > 0 ? Math.sin(S.time * 70) * 3 * a.shake / 0.35 : 0;
  ctx.fillStyle = 'rgba(90,60,70,0.22)';
  ctx.beginPath(); ctx.ellipse(a.bx, a.y + (GROUND - 3) * a.s, 56 * a.s, 8 * a.s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.imageSmoothingEnabled = false;
  if (a.flip) { ctx.translate(l + SPR.w * a.s + sh, a.y); ctx.scale(-1, 1); } else ctx.translate(l + sh, a.y);
  ctx.drawImage(RIG, -RX * a.s, -RY * a.s, RIG.width * a.s, RIG.height * a.s);
  ctx.restore();
}
function drawSplats(up) {
  ctx.imageSmoothingEnabled = false;
  for (const s of S.splats) {
    if (s.up !== up) continue;
    const sc = up ? 0.8 : 1, a = s.t > 1.1 ? Math.max(0, 1 - (s.t - 1.1) / 0.5) : 1;
    ctx.globalAlpha = a;
    ctx.drawImage(SPLAT_HI, s.x - 26 * sc, s.y - 20 * sc, 52 * sc, 24 * sc);
    ctx.globalAlpha = 1;
  }
}
function drawCakesWhere(pred) {
  ctx.imageSmoothingEnabled = true;
  for (const c of S.cakes) {
    if (!pred(c)) continue;
    let alpha = 1;
    if (c.state === 'ramp' && c.t < 0.12) alpha = c.t / 0.12;
    drawCake(c.x, c.y, c.rot, 1, alpha);
  }
}

function signPath(x, y, w, h) {
  const r = 9, mid = x + w / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(mid - 34, y);
  ctx.quadraticCurveTo(mid - 30, y - 12, mid, y - 13);
  ctx.quadraticCurveTo(mid + 30, y - 12, mid + 34, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function drawSign() {
  const x = 94, y = 72, w = 172, h = 54;
  ctx.save();
  ctx.fillStyle = 'rgba(60,30,20,0.25)'; ctx.translate(0, 3); signPath(x - 3, y - 3, w + 6, h + 6); ctx.fill(); ctx.translate(0, -3);
  signPath(x - 4, y - 4, w + 8, h + 8); ctx.fillStyle = '#4e2a17'; ctx.fill();
  signPath(x - 1.5, y - 1.5, w + 3, h + 3); ctx.fillStyle = '#c89a5c'; ctx.fill();
  signPath(x + 1, y + 1, w - 2, h - 2);
  const gr = ctx.createLinearGradient(0, y - 12, 0, y + h);
  gr.addColorStop(0, '#fff6e2'); gr.addColorStop(0.55, '#f4e2bf'); gr.addColorStop(1, '#e6cb9a');
  ctx.fillStyle = gr; ctx.fill();
  signPath(x + 4, y + 4, w - 8, h - 8); ctx.strokeStyle = 'rgba(120,70,35,0.55)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#7b4a2c';
  ctx.font = 'bold 11px Georgia, "Times New Roman", "Noto Serif", serif';
  const word = 'РЕСТОРАН'.split('').join(String.fromCharCode(8202) + String.fromCharCode(8202));
  ctx.fillText(word, 180, y + 13);
  ctx.font = 'bold 31px Georgia, "Times New Roman", "Noto Serif", serif';
  ctx.fillStyle = '#e9cf9e'; ctx.fillText('SANTINI', 181, y + 45);
  ctx.fillStyle = '#6a2316'; ctx.fillText('SANTINI', 180, y + 44);
  // ромбики-орнамент
  ctx.fillStyle = '#9b6a3f';
  [[x + 10, y + h / 2], [x + w - 10, y + h / 2]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.moveTo(dx, dy - 4); ctx.lineTo(dx + 3, dy); ctx.lineTo(dx, dy + 4); ctx.lineTo(dx - 3, dy); ctx.closePath(); ctx.fill(); });
  ctx.restore();
}
function pixelText(text, x, y, size, fill, outline = '#2a1820', ow = 4, align = 'left', shadow = 0) {
  ctx.font = `${size}px PS2P, monospace`; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.lineJoin = 'miter'; ctx.miterLimit = 2;
  if (shadow) { ctx.lineWidth = ow; ctx.strokeStyle = outline; ctx.strokeText(text, x, y + shadow); ctx.fillStyle = outline; ctx.fillText(text, x, y + shadow); }
  ctx.lineWidth = ow; ctx.strokeStyle = outline; ctx.strokeText(text, x, y);
  ctx.fillStyle = fill; ctx.fillText(text, x, y);
}
function drawTitle() {
  const y = 138, size = 19;
  ctx.font = `${size}px PS2P, monospace`;
  const g = ctx.createLinearGradient(0, y, 0, y + size);
  g.addColorStop(0, '#ffe1e8'); g.addColorStop(0.45, '#ffe1e8'); g.addColorStop(0.46, '#f9a9bc'); g.addColorStop(0.8, '#f9a9bc'); g.addColorStop(0.81, '#e57c97'); g.addColorStop(1, '#e57c97');
  pixelText('АШУР ВОРУЕТ ТОРТЫ', 180, y, size, g, '#3d1a29', 7, 'center', 4);
}
function pad(n) { return String(n).padStart(5, '0'); }
function drawHUD() {
  pixelText('СЧЁТ: ' + pad(S.score), 12, 14, 15, '#ffffff', '#24161d', 5);
  pixelText('РЕКОРД: ' + pad(Math.max(record, S.score)), 12, 38, 10, '#ffffff', '#24161d', 4);
  ctx.imageSmoothingEnabled = false;
  for (let i = 0; i < 4; i++) {
    const x = SW - 12 - (4 - i) * 27, y = 10;
    if (i < S.lives) ctx.drawImage(LIFE, x, y, 24, 24);
    else ctx.drawImage(HEART, x, y + 1, 24, 22);
  }
  // звук
  const sx = SW - 30, sy = 42;
  ctx.fillStyle = 'rgba(36,22,29,0.55)'; ctx.fillRect(sx - 2, sy - 2, 22, 18);
  ctx.fillStyle = '#fff';
  ctx.fillRect(sx + 2, sy + 4, 4, 6); ctx.beginPath(); ctx.moveTo(sx + 6, sy + 4); ctx.lineTo(sx + 10, sy); ctx.lineTo(sx + 10, sy + 14); ctx.lineTo(sx + 6, sy + 10); ctx.fill();
  if (muted) { ctx.strokeStyle = '#ff6b81'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx + 12, sy + 3); ctx.lineTo(sx + 18, sy + 11); ctx.moveTo(sx + 18, sy + 3); ctx.lineTo(sx + 12, sy + 11); ctx.stroke(); }
  else { ctx.fillRect(sx + 12, sy + 5, 2, 4); ctx.fillRect(sx + 15, sy + 3, 2, 8); }
}
// 4 кнопки — 4 полки (как в «Ну, погоди!»): стрелка показывает, откуда падает торт
const BTNS = [
  { id: 'UL', side: 'L', up: true,  x: 12,  y: 578, w: 62, h: 62, d: [-1, -1] },
  { id: 'DL', side: 'L', up: false, x: 12,  y: 648, w: 62, h: 62, d: [-1, 1] },
  { id: 'UR', side: 'R', up: true,  x: 286, y: 578, w: 62, h: 62, d: [1, -1] },
  { id: 'DR', side: 'R', up: false, x: 286, y: 648, w: 62, h: 62, d: [1, 1] },
];
const pressed = {};
function drawButtons() {
  for (const b of BTNS) {
    const on = pressed[b.id] > 0, here = S.mode === 'play' && S.side === b.side && S.up === b.up;
    ctx.save();
    ctx.fillStyle = on ? 'rgba(255,255,255,0.68)' : here ? 'rgba(255,214,226,0.5)' : 'rgba(255,255,255,0.34)';
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2.5;
    roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(110,95,125,0.35)'; ctx.lineWidth = 1.5; roundRect(b.x + 3, b.y + 3, b.w - 6, b.h - 6, 8); ctx.stroke();
    // стрелка по диагонали: ↖ ↙ ↗ ↘
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2, r = 15;
    const tx = cx + b.d[0] * r * 0.72, ty = cy + b.d[1] * r * 0.72;   // остриё
    const sx = cx - b.d[0] * r * 0.72, sy = cy - b.d[1] * r * 0.72;   // хвост
    const hl = 14;
    ctx.beginPath();
    ctx.moveTo(sx, sy); ctx.lineTo(tx, ty);
    ctx.moveTo(tx - b.d[0] * hl, ty); ctx.lineTo(tx, ty); ctx.lineTo(tx, ty - b.d[1] * hl);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(95,80,110,0.55)'; ctx.lineWidth = 8; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.97)'; ctx.lineWidth = 4; ctx.stroke();
    ctx.restore();
  }
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawFx() {
  for (const f of S.fx) {
    const p = f.t / f.life;
    if (f.kind === 'text') {
      ctx.globalAlpha = p > 0.7 ? (1 - p) / 0.3 : 1;
      pixelText(f.text, f.x, f.y - p * 30, 11, f.col, '#24161d', 4, 'center');
      ctx.globalAlpha = 1;
    } else if (f.kind === 'spark') {
      const x = f.x + f.vx * f.t, y = f.y + f.vy * f.t + 300 * f.t * f.t, s = 4 * (1 - p) + 1;
      ctx.fillStyle = p < 0.5 ? '#fff6b0' : '#ffd15a';
      ctx.fillRect(x - s / 2, y - s * 1.5, s, s * 3); ctx.fillRect(x - s * 1.5, y - s / 2, s * 3, s);
    }
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#ece5f0'; ctx.fillRect(0, 0, cv.width, cv.height);
  let sx = 0, sy = 0;
  if (S.shake > 0) { sx = (Math.random() - 0.5) * 6 * S.shake / 0.25; sy = (Math.random() - 0.5) * 6 * S.shake / 0.25; }
  ctx.setTransform(DPR * KS, 0, 0, DPR * KS, DPR * (OX + sx * KS), DPR * (OY + sy * KS));
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bgLayer, BG.x0, BG.y0, BG.w, BG.h);
  drawSign();
  ctx.imageSmoothingEnabled = false; ctx.drawImage(decoLayer, BG.x0, BG.y0, BG.w, BG.h);
  drawTitle();

  const isUp = c => RAMPS[c.ramp].up;
  drawSplats(true);
  drawCakesWhere(c => isUp(c) && c.state !== 'caught');               // верхние полки и падающие мимо
  if (S.up) drawAshur();
  ctx.imageSmoothingEnabled = false; ctx.drawImage(lowerLayer, BG.x0, BG.y0, BG.w, BG.h);
  drawSplats(false);
  drawCakesWhere(c => !isUp(c) && c.state !== 'caught');
  for (const g of GUESTS_DRAW) drawGuest(g);
  if (!S.up) drawAshur();
  drawCakesWhere(c => c.state === 'caught');
  drawFx();
  if (S.bubbles.L) drawBubble(S.bubbles.L);
  if (S.bubbles.R) drawBubble(S.bubbles.R);
  drawHUD();
  drawButtons();
}

/* ==== ВВОД ==== */
function toStage(e) { return { x: (e.clientX - OX) / KS, y: (e.clientY - OY) / KS }; }
function press(id) {
  const b = BTNS.find(x => x.id === id);
  if (b) { pressed[id] = 0.12; setPos(b.side, b.up); return; }
  if (id === 'L') setPos('L', S.up);
  if (id === 'R') setPos('R', S.up);
  if (id === 'U') setPos(S.side, true);
  if (id === 'D') setPos(S.side, false);
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const p = toStage(e);
  if (p.x > SW - 36 && p.y > 36 && p.y < 64 && p.x < SW) { toggleMute(); return; }
  for (const b of BTNS) if (p.x >= b.x - 6 && p.x <= b.x + b.w + 6 && p.y >= b.y - 6 && p.y <= b.y + b.h + 6) { press(b.id); return; }
  if (S.mode === 'play' && p.y > 200 && p.y < 572) setPos(p.x < SW / 2 ? 'L' : 'R', p.y < 400);
}, { passive: false });
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const map = { arrowleft: 'L', a: 'L', 'ф': 'L', arrowright: 'R', d: 'R', 'в': 'R', arrowup: 'U', w: 'U', 'ц': 'U', arrowdown: 'D', s: 'D', 'ы': 'D' };
  const quad = { '7': ['L', true], '1': ['L', false], '9': ['R', true], '3': ['R', false], q: ['L', true], z: ['L', false], e: ['R', true], c: ['R', false] };
  if (map[k]) { e.preventDefault(); press(map[k]); }
  else if (quad[k]) { const b = BTNS.find(x => x.side === quad[k][0] && x.up === quad[k][1]); press(b.id); }
  else if ((k === 'enter' || k === ' ') && S.mode !== 'play') { e.preventDefault(); document.getElementById('btnMain').click(); }
});
function toggleMute() {
  muted = !muted; try { localStorage.setItem('ashur_mute', muted ? '1' : '0'); } catch (e) {}
  if (!muted) SFX.catch();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'play') { S.mode = 'pause'; showPanel('pause'); } });

/* ==== ПАНЕЛИ ==== */
const panel = document.getElementById('panel'), pTitle = document.getElementById('pTitle'), pBody = document.getElementById('pBody');
const btnMain = document.getElementById('btnMain'), btnShare = document.getElementById('btnShare');
function showPanel(kind) {
  btnShare.style.display = 'none';
  if (kind === 'title') {
    panel.style.top = '178px';
    pTitle.textContent = 'СВАДЬБА В SANTINI';
    pBody.innerHTML = `<p>Торты съезжают по полкам. Лови их ящиком, пока не упали!</p>
      <p class="keys">4 кнопки — 4 полки:<br>левые кнопки — левые полки,<br>правые — правые. Верх — верх.</p>
      <p>Можно жать прямо на полку.<br>Уронишь 4 торта — Ашура поймают.</p>
      <div class="rec">РЕКОРД: ${pad(record)}</div>`;
    btnMain.textContent = 'ИГРАТЬ';
  } else if (kind === 'over') {
    panel.style.top = '200px';
    pTitle.textContent = 'АШУРА ПОЙМАЛИ!';
    pBody.innerHTML = `<p>Утащено тортов: ${S.caught}</p>
      <div class="big">СЧЁТ: ${pad(S.score)}</div>
      <div class="rec ${S.newRecord ? 'new' : ''}">${S.newRecord ? 'НОВЫЙ РЕКОРД!' : 'РЕКОРД: ' + pad(record)}</div>`;
    btnMain.textContent = 'ЕЩЁ РАЗ';
    btnShare.style.display = 'block';
  } else if (kind === 'pause') {
    panel.style.top = '230px';
    pTitle.textContent = 'ПАУЗА';
    pBody.innerHTML = `<p>Ашур спрятался за шторой.</p>`;
    btnMain.textContent = 'ПРОДОЛЖИТЬ';
  }
  panel.dataset.kind = kind;
  panel.classList.remove('show'); void panel.offsetWidth; panel.classList.add('show');
}
function hidePanel() { panel.classList.remove('show'); }
btnMain.addEventListener('click', () => {
  if (panel.dataset.kind === 'pause') { S.mode = 'play'; hidePanel(); return; }
  startGame();
});
btnShare.addEventListener('click', () => {
  const url = SHARE_URL || location.href.split('#')[0];
  const text = `Я утащил ${S.caught} ${plural(S.caught, 'торт', 'торта', 'тортов')} из ресторана Santini 🎂 Счёт: ${S.score}. Слабо больше?`;
  const share = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text);
  if (inTG) tgTry(() => TG.openTelegramLink(share));
  else if (navigator.share) navigator.share({ title: 'Ашур ворует торты', text, url }).catch(() => {});
  else window.open(share, '_blank');
});
function plural(n, a, b, c) { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return a; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return b; return c; }

/* ==== ДЕКОР ПОВЕРХ ВЫВЕСКИ ==== */
let decoLayer = null;
function paintDeco() {
  const L = Layer(BG.x0, BG.y0, BG.w, BG.h, AP), R = rng(777);
  bouquet(L, 92, 70, 11, R, 6); bouquet(L, 268, 70, 11, R, 6);
  garland(L, [[96, 128], [120, 133], [150, 135]], 3, R, 13, 3, 2);
  garland(L, [[264, 128], [240, 133], [210, 135]], 3, R, 13, 3, 2);
  return L.done();
}

/* ==== ЗАПУСК ==== */
function build() {
  const bgL = paintBackground();
  paintPlank(bgL, RAMPS[0]); paintPlank(bgL, RAMPS[2]);
  bgLayer = bgL.done();
  const lo = Layer(BG.x0, BG.y0, BG.w, BG.h, AP);
  paintPlank(lo, RAMPS[1]); paintPlank(lo, RAMPS[3]);
  lowerLayer = lo.done();
  decoLayer = paintDeco();
}
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);              // следующий кадр заказываем сразу — сбой в кадре не остановит игру
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  for (const k in pressed) pressed[k] -= dt;
  try { if (S.mode !== 'pause') update(dt); render(); } catch (e) { console.error(e); }
}
resize(); build();
const fontReady = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load('16px PS2P', 'АБВ СЧЁТ'), document.fonts.load('16px PS2P', 'ABC 0123')]).catch(() => {}) : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(() => {
  showPanel('title');
  requestAnimationFrame(t => { last = t; frame(t); });
});
window.__ashur = { S, startGame, setPos, RAMPS, update, ashurTarget, crowd, GUESTS, say };
})();
